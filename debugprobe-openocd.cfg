# OpenOCD config for Raspberry Pi Debug Probe (CMSIS-DAP) to program Pico
# Compatible with OpenOCD 0.12+ (adapter usb vid_pid was removed).
adapter driver cmsis-dap
adapter speed 1000
transport select swd
source [find target/rp2040.cfg]

# El rp2040.cfg de algunas distros registra un evento reset-init que usa el
# comando "rp2xxx rom_api_call", inexistente en OpenOCD 0.12:
#   Error: args[i] option value ('CX') is not valid
# El grabado/verificado funcionan igual, pero anulamos el handler para que
# no aborte el evento de reset.
rp2040.core0 configure -event reset-init {}

init
